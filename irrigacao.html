<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Irrigação</title><link rel="stylesheet" href="{{ url_for('static', filename='estilo.css') }}"></head>
<body>
    <h1>EcoGarden - Irrigação</h1>
    <p><a href="/usuarios">Usuários</a> | <a href="/dispositivos">Dispositivos</a> | <a href="/leituras">Leituras</a> | <a href="/irrigacao">Irrigação</a></p>
    
    <form action="/add_irrig" method="POST">
        <input name="disp_id" placeholder="ID Dispositivo" required>
        <input name="tempo" placeholder="Tempo (s)" required>
        <button>Salvar</button>
    </form>

    <table>
        <tr><th>ID</th><th>Disp ID</th><th>Tempo (s)</th><th>Ação</th></tr>
        {% for i in dados %}
        <tr><td>{{i[0]}}</td><td>{{i[1]}}</td><td>{{i[2]}}</td><td><a href="/del_irrig/{{i[0]}}">Excluir</a></td></tr>
        {% endfor %}
    </table>
</body>
</html>
